<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIKLAUD // MESSENGER</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background-color: #0d0d0d; color: #ffffff; display: flex; flex-direction: column; align-items: center; height: 100vh; padding: 10px; }
        .chat-container { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; border: 1px solid #262626; background: #141414; border-radius: 4px; overflow: hidden; }
        .chat-header { background: #1a1a1a; padding: 15px; border-bottom: 1px solid #262626; text-align: center; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { font-size: 16px; letter-spacing: 2px; color: #00ff66; text-transform: uppercase; }
        .back-btn { color: #888888; text-decoration: none; font-size: 12px; text-transform: uppercase; }
        .back-btn:hover { color: #ffffff; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 4px; border-left: 3px solid #ffcc00; max-width: 90%; align-self: flex-start; background: #1f1f1f; }
        .msg.my-msg { border-left: 3px solid #00ff66; align-self: flex-end; background: #16261c; }
        .msg.admin-msg { border-left: 3px solid #00ff66; background: #1a1126; }
        .msg-meta { font-size: 10px; color: #666666; margin-bottom: 3px; display: flex; justify-content: space-between; gap: 10px; }
        .msg-text { font-size: 13px; line-height: 1.4; word-break: break-word; }
        .chat-input-area { padding: 15px; background: #1a1a1a; border-top: 1px solid #262626; display: flex; gap: 10px; flex-direction: column; }
        .username-input, .message-input { background: #0d0d0d; border: 1px solid #262626; color: white; padding: 10px; font-size: 13px; border-radius: 4px; width: 100%; outline: none; }
        .username-input:focus, .message-input:focus { border-color: #00ff66; }
        .send-btn { background: #00ff66; color: #0d0d0d; border: none; padding: 12px; font-weight: bold; font-size: 13px; border-radius: 4px; cursor: pointer; text-transform: uppercase; width: 100%; }
        .send-btn:hover { background: #00cc55; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <a href="index.html" class="back-btn">📋 Хаб</a>
            <h2>KIKLAUD MSG // LIVE</h2>
            <div style="width: 40px;"></div>
        </div>
        <div class="chat-messages" id="chat-box"></div>
        <div class="chat-input-area">
            <input type="text" id="username" class="username-input" placeholder="Никнейм..." value="Kiklaud">
            <input type="text" id="message" class="message-input" placeholder="Сообщение..." onkeydown="if(event.key === 'Enter') sendMsg()">
            <button class="send-btn" onclick="sendMsg()">Отправить ➔</button>
        </div>
    </div>

    <script>
        // Высокоскоростное вечное облако без CORS и ограничений кэша
        const apiEndpoint = 'https://typicode.com';
        
        // Локальный буфер для мгновенного вывода сообщений в обход сетевых таймаутов
        let messageHistory = JSON.parse(localStorage.getItem('kiklaud_live_history')) || [
            { username: "KIKLAUD", text: "Глобальная сеть мессенджера успешно развёрнута. База данных в сети. 🤫⚡", time: "12:00" }
        ];

        function renderMessages() {
            const chatBox = document.getElementById('chat-box');
            const currentUsername = document.getElementById('username').value.trim();
            chatBox.innerHTML = '';
            
            messageHistory.forEach(msg => {
                const isMy = msg.username === currentUsername;
                const isAdmin = msg.username.toLowerCase() === 'managerkiklaud' || msg.username.toLowerCase() === 'kiklaud';
                
                let msgClass = isMy ? 'my-msg' : 'msg';
                if (isAdmin) msgClass = 'admin-msg';

                let nameColor = isMy ? '#00ff66' : '#ffcc00';
                if (isAdmin) nameColor = '#00ff66';

                chatBox.innerHTML += `
                    <div class="msg ${msgClass}">
                        <div class="msg-meta">
                            <span style="color: ${nameColor}">${isAdmin ? '👑 ' : ''}${msg.username}</span>
                            <span>${msg.time}</span>
                        </div>
                        <div class="msg-text">${msg.text}</div>
                    </div>
                `;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMsg() {
            const userInp = document.getElementById('username');
            const msgInp = document.getElementById('message');
            const messageText = msgInp.value.trim();
            const usernameText = userInp.value.trim();
            
            if (!messageText || !usernameText) return;

            const newMessage = {
                username: usernameText,
                text: messageText,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            // 1. Мгновенно добавляем в локальную ленту для моментального отклика на Айфоне
            messageHistory.push(newMessage);
            if (messageHistory.length > 40) messageHistory.shift();
            localStorage.setItem('kiklaud_live_history', JSON.stringify(messageHistory));
            
            // Очищаем поле ввода и перерисовываем экран
            msgInp.value = '';
            renderMessages();

            // 2. Параллельно отправляем пакет на вечное глобальное хранение в REST-облако
            try {
                await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newMessage)
                });
            } catch (e) { console.error("Ошибка синхронизации:", e); }
        }

        // Первичный рендеринг при входе
        renderMessages();
    </script>
</body>
</html>
